# Minimal runtime: no model-facing shell, write, edit, or arbitrary execution tools.
- id: persistent-bash
  disabled: true
- id: persistent-pwsh
  disabled: true
- insert:
    - id: thinbook-web
      name: '@deepseek-ai/dsh-web'
    - id: thinbook-web-search
      name: '@deepseek-ai/dsh-web-search-deepseek'
      config:
        apiKeyEnv: DEEPSEEK_API_KEY
        maxUses: 4
    - id: thinbook-web-fetch
      name: '@deepseek-ai/dsh-web-fetch-http'
    - id: thinbook-tool-web
      name: '@deepseek-ai/dsh-tool-web'
    - id: thinbook-skill
      name: '@deepseek-ai/dsh-skill'
    - id: thinbook-skill-filesystem
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        includeDefaultRoots: false
        customSkillDirs: ['.dsh/skills']
        watch: false
    - id: thinbook-tool-skill
      name: '@deepseek-ai/dsh-tool-skill'
